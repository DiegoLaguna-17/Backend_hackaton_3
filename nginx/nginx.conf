worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    upstream usuarios-service {
        server usuarios-service:3001;
    }
    upstream tareas-service {
        server tareas-service:3002;
    }
    upstream calificacion-service {
        server calificacion-service:3003;
    }
    upstream plagio-service {
        server plagio-service:3004;
    }
    upstream lms-service {
        server lms-service:3005;
    }
    upstream servicio_6 {
        server servicio_6:3006;
    }

    server {
        listen 80;

        # =========================
        # 🌐 CORS GLOBAL (GATEWAY)
        # =========================
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Manejo de preflight (OPTIONS)
        if ($request_method = OPTIONS) {
            return 204;
        }

        location /api/usuarios {
            rewrite ^/api/usuarios/?(.*)$ /$1 break;
            proxy_pass http://usuarios-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/tareas {
            rewrite ^/api/tareas/?(.*)$ /$1 break;
            proxy_pass http://tareas-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/calificacion {
            rewrite ^/api/calificacion/?(.*)$ /$1 break;
            proxy_pass http://calificacion-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/plagio {
            rewrite ^/api/plagio/?(.*)$ /$1 break;
            proxy_pass http://plagio-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/lms {
            rewrite ^/api/lms/?(.*)$ /$1 break;
            proxy_pass http://lms-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/servicio_6 {
            rewrite ^/api/servicio_6/?(.*)$ /$1 break;
            proxy_pass http://servicio_6;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}