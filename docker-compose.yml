version: '3.8'

services:
  usuarios-service:
    build: ./usuarios-service
    ports:
      - "3001:3001"
    env_file:
      - ./usuarios-service/.env
    networks:
      - microservices-net

  tareas-service:
    build: ./tareas-service
    ports:
      - "3002:3002"
    env_file:
      - ./tareas-service/.env
    networks:
      - microservices-net

  calificacion-service:
    build: ./calificacion-service
    ports:
      - "3003:3003"
    env_file:
      - ./calificacion-service/.env
    networks:
      - microservices-net

  plagio-service:
    build: ./plagio-service
    ports:
      - "3004:3004"
    env_file:
      - ./plagio-service/.env
    networks:
      - microservices-net

  lms-service:
    build: ./lms-service
    ports:
      - "3005:3005"
    env_file:
      - ./lms-service/.env
    networks:
      - microservices-net

  servicio_6:
    build: ./servicio_6
    ports:
      - "3006:3006"
    env_file:
      - ./servicio_6/.env
    networks:
      - microservices-net

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - usuarios-service
      - tareas-service
      - calificacion-service
      - plagio-service
      - lms-service
      - servicio_6
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
